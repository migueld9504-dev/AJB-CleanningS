<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow" />
    <title>Gallery Hub v3.1 | AJB Cleaning Services</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d4af37;
            --primary-dark: #b8962e;
            --bg: #0a0a0c;
            --card-bg: #16161a;
            --text: #ffffff;
            --text-dim: #a0a0a8;
            --border: rgba(255, 255, 255, 0.1);
            --success: #22c55e;
            --danger: #ef4444;
            --pending: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, .font-outfit { font-family: 'Outfit', sans-serif; }

        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }

        /* Header & Dashboard */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--border);
            text-align: center;
            transition: transform 0.3s ease;
        }
        .stat-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .stat-val { display: block; font-size: 2.5rem; font-weight: 700; color: var(--primary); margin-bottom: 0.25rem; }
        .stat-label { font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

        /* Controls */
        .controls-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            background: rgba(255,255,255,0.03);
            padding: 1rem;
            border-radius: 12px;
            align-items: center;
        }

        select, input {
            background: #1f1f23;
            border: 1px solid var(--border);
            color: white;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            outline: none;
            transition: all 0.3s;
        }
        select:focus, input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2); }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-primary:hover { background: var(--primary-dark); transform: scale(1.02); }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: rgba(212,175,55,0.1); }

        /* Grid */
        .main-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .item-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
            transition: all 0.3s ease;
        }
        .item-card:hover { border-color: var(--primary); }

        .card-media {
            height: 200px;
            background: #000;
            position: relative;
            overflow: hidden;
        }
        .card-media img, .card-media video {
            width: 100%; height: 100%; object-fit: cover;
        }
        .status-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            z-index: 2;
        }
        .status-pending { background: var(--pending); color: #000; }
        .status-approved { background: var(--success); color: #fff; }
        .status-rejected { background: var(--danger); color: #fff; }

        .card-content { padding: 1.5rem; }
        .card-id { font-size: 0.7rem; color: var(--primary); font-weight: 600; margin-bottom: 0.5rem; display: block; }
        .card-title { font-size: 1.1rem; margin-bottom: 0.5rem; }
        .card-desc { font-size: 0.9rem; color: var(--text-dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Review Modal */
        #reviewModal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .modal-container {
            width: 90%;
            max-width: 1100px;
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            overflow: hidden;
            max-height: 90vh;
        }

        .modal-preview {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .modal-preview img, .modal-preview video { max-width: 100%; max-height: 100%; object-fit: contain; }

        .modal-details {
            padding: 3rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            overflow-y: auto;
        }

        .edit-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .edit-group label { font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
        .edit-group input, .edit-group textarea {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: white;
            padding: 1rem;
            border-radius: 8px;
            width: 100%;
        }
        .edit-group textarea { height: 80px; resize: none; }

        .modal-actions {
            margin-top: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn-approve { background: var(--success); color: white; }
        .btn-reject { background: var(--danger); color: white; }

        .nav-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .export-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .export-box {
            background: #1a1a1e;
            padding: 3rem;
            border-radius: 20px;
            max-width: 600px;
            width: 90%;
            text-align: center;
        }
        #exportArea {
            width: 100%;
            height: 300px;
            background: #000;
            color: #22c55e;
            font-family: monospace;
            padding: 1rem;
            margin: 1.5rem 0;
            border-radius: 8px;
            font-size: 0.8rem;
        }

        @media (max-width: 900px) {
            .modal-container { grid-template-columns: 1fr; }
            .modal-preview { height: 300px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1 class="font-outfit" style="font-size: 2.5rem; letter-spacing: -1px;">Gallery Hub <span style="color:var(--primary)">v3.1</span></h1>

        </div>
        <div style="display: flex; gap: 1rem;">
            <button class="btn btn-outline" onclick="exportData()">Finalize & Export</button>
            <button class="btn btn-primary" onclick="startReview()">Start Review Mode</button>

    </header>

    <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
            <span class="stat-val" id="statTotal">0</span>
            <span class="stat-label">Total Items</span>
        </div>
        <div class="stat-card">
            <span class="stat-val" id="statPending" style="color:var(--pending)">0</span>
            <span class="stat-label">Pending Review</span>
        </div>
        <div class="stat-card">
            <span class="stat-val" id="statApproved" style="color:var(--success)">0</span>
            <span class="stat-label">Approved</span>
        </div>
        <div class="stat-card">
            <span class="stat-val" id="statRejected" style="color:var(--danger)">0</span>
            <span class="stat-label">Rejected</span>
        </div>
    </div>

    <div class="controls-bar">
        <input type="text" placeholder="Search by title or ID..." id="searchInput" oninput="filterItems()" style="flex: 1;">
        <select id="catFilter" onchange="filterItems()">
            <option value="all">All Categories</option>
            <option value="offices_recep">Offices & Receptions</option>
            <option value="classrooms">Classrooms / Schools</option>
            <option value="auditoriums">Auditoriums</option>
            <option value="gym">Fitness Centers</option>
            <option value="dining">Dining Rooms</option>
            <option value="training">Training Centers</option>
            <option value="church">Churches</option>
            <option value="hospitals">Hospitals & Clinics</option>
            <option value="green_zones">Green Zones</option>
            <option value="carpets">Carpets & Floors</option>
        </select>
        <select id="statusFilter" onchange="filterItems()">
            <option value="all">All Status</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
        </select>
    </div>

    <div class="main-grid" id="mainGrid">
        <!-- Items will be rendered here -->
    </div>
</div>

<!-- Review Modal -->
<div id="reviewModal">
    <div class="modal-container">
        <div class="modal-preview" id="modalPreview">
            <!-- Media here -->
        </div>
        <div class="modal-details">
            <div id="reviewProgress" style="font-size: 0.8rem; color: var(--primary); font-weight: 700;">ITEM 1 OF 50</div>
            
            <div class="edit-group">
                <label>English Title</label>
                <input type="text" id="editTitleEn">
            </div>
            <div class="edit-group">
                <label>Spanish Title</label>
                <input type="text" id="editTitleEs">
            </div>
            <div class="edit-group">
                <label>English Description</label>
                <textarea id="editDescEn"></textarea>
            </div>
            <div class="edit-group">
                <label>Spanish Description</label>
                <textarea id="editDescEs"></textarea>
            </div>

            <div class="modal-actions">
                <button class="btn btn-reject" onclick="reviewAction('rejected')">Reject / Remove</button>
                <button class="btn btn-approve" onclick="reviewAction('approved')">Approve Item</button>
            </div>

            <div class="nav-actions">
                <button class="btn btn-outline" style="padding: 0.5rem 1rem;" onclick="prevItem()">← Previous</button>
                <button class="btn btn-outline" style="padding: 0.5rem 1rem;" onclick="nextItem()">Next →</button>
                <button class="btn btn-outline" style="border:none; color: #666;" onclick="closeReview()">Close Esc</button>
            </div>
        </div>
    </div>
</div>

<!-- Export Modal -->
<div class="export-overlay" id="exportOverlay">
    <div class="export-box">
        <h2 class="font-outfit">Export Synchronization Data</h2>
        <p style="color:var(--text-dim); margin-top: 0.5rem;">Copy this JSON and provide it to the developer to sync the website.</p>
        <textarea id="exportArea" readonly></textarea>
        <div style="display:flex; gap: 1rem; justify-content: center;">
            <button class="btn btn-primary" onclick="copyExport()">Copy to Clipboard</button>
            <button class="btn btn-outline" onclick="document.getElementById('exportOverlay').style.display='none'">Close</button>
        </div>
    </div>
</div>

        { id: "vid_aud", img: "img/auditorio-1.jpg", video: "img/auditorio-1.mp4", cat: "auditoriums", title_en: "Auditorium Action", title_es: "Auditorio en Acción", desc_en: "Watch our team transform the space.", desc_es: "Mira a nuestro equipo transformar el espacio.", status: "approved" },

    ];

    let items = initialData.map(i => ({ ...i, status: i.status || 'pending' }));
    let currentReviewIdx = 0;

    // Load saved status if exists
    try {
        const saved = localStorage.getItem('ajb_gallery_state');
        if (saved) {
            const savedItems = JSON.parse(saved);
            items = items.map(item => {
                const s = savedItems.find(si => si.id === item.id);
                return s ? { ...item, status: s.status, title_en: s.title_en || item.title_en, title_es: s.title_es || item.title_es, desc_en: s.desc_en || item.desc_en, desc_es: s.desc_es || item.desc_es } : item;
            });
        }
    } catch(e) {}

    function saveState() {
        localStorage.setItem('ajb_gallery_state', JSON.stringify(items));
        updateStats();
    }

    function updateStats() {
        document.getElementById('statTotal').innerText = items.length;
        document.getElementById('statPending').innerText = items.filter(i => i.status === 'pending').length;
        document.getElementById('statApproved').innerText = items.filter(i => i.status === 'approved').length;
        document.getElementById('statRejected').innerText = items.filter(i => i.status === 'rejected').length;
    }

    function filterItems() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const cat = document.getElementById('catFilter').value;
        const status = document.getElementById('statusFilter').value;

        const filtered = items.filter(item => {
            const matchesSearch = item.title_en.toLowerCase().includes(search) || item.id.toLowerCase().includes(search);
            const matchesCat = cat === 'all' || item.cat === cat;
            const matchesStatus = status === 'all' || item.status === status;
            return matchesSearch && matchesCat && matchesStatus;
        });

        renderGrid(filtered);
    }

    function renderGrid(data = items) {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = '';
        
        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            const isVideo = !!item.video;
            
            card.innerHTML = `
                <div class="card-media">
                    <span class="status-badge status-${item.status}">${item.status}</span>
                    ${isVideo ? `<video src="${item.video}" muted loop onmouseover="this.play()" onmouseout="this.pause()"></video>` : `<img src="${item.img}" loading="lazy">`}
                </div>
                <div class="card-content">
                    <span class="card-id">${item.id} | ${item.cat}</span>
                    <h3 class="card-title">${item.title_en}</h3>
                    <p class="card-desc">${item.desc_en}</p>
                    <div style="margin-top: 1rem; display: flex; gap: 0.5rem;">
                        <button class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.7rem;" onclick="openReviewItem('${item.id}')">Edit / Review</button>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function startReview() {
        const pending = items.findIndex(i => i.status === 'pending');
        currentReviewIdx = pending !== -1 ? pending : 0;
        openReviewModal();
    }

    function openReviewItem(id) {
        currentReviewIdx = items.findIndex(i => i.id === id);
        openReviewModal();
    }

    function openReviewModal() {
        const item = items[currentReviewIdx];
        if (!item) return;

        const modal = document.getElementById('reviewModal');
        const preview = document.getElementById('modalPreview');
        const isVideo = !!item.video;

        preview.innerHTML = isVideo ? `<video src="${item.video}" controls autoplay loop></video>` : `<img src="${item.img}">`;
        
        document.getElementById('reviewProgress').innerText = `ITEM ${currentReviewIdx + 1} OF ${items.length}`;
        document.getElementById('editTitleEn').value = item.title_en;
        document.getElementById('editTitleEs').value = item.title_es;
        document.getElementById('editDescEn').value = item.desc_en;
        document.getElementById('editDescEs').value = item.desc_es;

        modal.style.display = 'flex';
    }

    function reviewAction(status) {
        const item = items[currentReviewIdx];
        item.status = status;
        item.title_en = document.getElementById('editTitleEn').value;
        item.title_es = document.getElementById('editTitleEs').value;
        item.desc_en = document.getElementById('editDescEn').value;
        item.desc_es = document.getElementById('editDescEs').value;
        
        saveState();
        filterItems();
        nextItem();
    }

    function nextItem() {
        if (currentReviewIdx < items.length - 1) {
            currentReviewIdx++;
            openReviewModal();
        } else {
            closeReview();
            alert("Review session complete!");
        }
    }

    function prevItem() {
        if (currentReviewIdx > 0) {
            currentReviewIdx--;
            openReviewModal();
        }
    }

    function closeReview() {
        document.getElementById('reviewModal').style.display = 'none';
        const vid = document.querySelector('#modalPreview video');
        if(vid) vid.pause();
    }

    function exportData() {
        const report = {
            timestamp: new Date().toISOString(),
            approved: items.filter(i => i.status === 'approved'),
            rejected_ids: items.filter(i => i.status === 'rejected').map(i => i.id),
            pending_count: items.filter(i => i.status === 'pending').length
        };
        
        document.getElementById('exportArea').value = JSON.stringify(report, null, 2);
        document.getElementById('exportOverlay').style.display = 'flex';
    }

    function copyExport() {
        const area = document.getElementById('exportArea');
        area.select();
        document.execCommand('copy');
        alert("JSON copied to clipboard!");
    }

    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeReview();
    });

    // Init
    updateStats();
    renderGrid();
</script>
